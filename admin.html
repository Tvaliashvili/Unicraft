<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unicraft — Admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Login screen -->
<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <img class="brand-logo brand-logo--lg" src="logo.svg" alt="Unicraft" />
    <p style="color: var(--color-text-muted); margin: 0 0 20px; font-size: 0.9rem; text-align: center;">Admin — sign in to manage products and orders.</p>
    <div class="form-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password" />
    </div>
    <div id="login-error" class="form-error" hidden></div>
    <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%;">Sign In</button>
  </form>
</div>

<!-- Admin dashboard -->
<div id="admin-app" hidden>
  <header class="site-header">
    <div class="container">
      <a href="admin.html" class="brand"><img class="brand-logo" src="logo.svg" alt="Unicraft" /></a>
      <nav class="admin-tabs">
        <button class="admin-tab active" data-tab="products">Products</button>
        <button class="admin-tab" data-tab="orders">Orders</button>
      </nav>
      <button class="btn btn-secondary" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Products panel -->
      <section id="panel-products" class="admin-panel">
        <div class="admin-panel__header">
          <h2 class="section-title" style="margin:0;">Products</h2>
          <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th></th>
                <th>Name</th>
                <th>Category</th>
                <th>Base Cost</th>
                <th>Selling Price</th>
                <th>In Stock</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="products-table-body">
              <tr><td colspan="7" class="empty-state">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Orders panel -->
      <section id="panel-orders" class="admin-panel" hidden>
        <div class="admin-panel__header">
          <h2 class="section-title" style="margin:0;">Orders</h2>
          <button class="btn btn-secondary" id="refresh-orders-btn">Refresh</button>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="orders-table-body">
              <tr><td colspan="7" class="empty-state">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </main>
</div>

<!-- Product form modal -->
<div class="overlay" id="product-form-modal">
  <div class="modal">
    <div class="modal__header">
      <h2 id="product-form-title">Add Product</h2>
      <button class="modal__close" id="product-form-close" aria-label="Close">&times;</button>
    </div>
    <form class="modal__body" id="product-form">
      <input type="hidden" id="product-id" />

      <div class="form-group">
        <label for="product-name">Name</label>
        <input type="text" id="product-name" required />
      </div>

      <div class="form-group">
        <label for="product-description">Description</label>
        <textarea id="product-description"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="product-base-cost">Base Cost ($)</label>
          <input type="number" id="product-base-cost" step="0.01" min="0" required />
        </div>
        <div class="form-group">
          <label for="product-selling-price">Selling Price ($)</label>
          <input type="number" id="product-selling-price" step="0.01" min="0" required />
        </div>
      </div>

      <div class="form-group">
        <label for="product-category">Category</label>
        <input type="text" id="product-category" required placeholder="e.g. Home, Electronics" />
      </div>

      <div class="form-group">
        <label for="product-image">Product Image</label>
        <input type="file" id="product-image" accept="image/*" />
        <img id="product-image-preview" src="" alt="" hidden style="margin-top:8px; width:100px; height:100px; object-fit:cover; border-radius:8px;" />
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="product-in-stock" style="width:auto;" checked />
        <label for="product-in-stock" style="margin:0;">In Stock</label>
      </div>

      <div id="product-form-error" class="form-error" hidden></div>

      <button type="submit" class="btn btn-primary" id="product-save-btn" style="width:100%;">Save Product</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
